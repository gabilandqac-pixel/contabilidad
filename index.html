<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contabilidad - Compras</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial, sans-serif;
}

body{
  background:#f4f7fb;
  color:#17324d;
}

header{
  background:#0b3d66;
  color:white;
  padding:20px 30px;
}

header h1{
  font-size:24px;
}

header p{
  margin-top:5px;
  opacity:.85;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:25px;
}

.resumen{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:25px;
}

.card{
  background:white;
  padding:20px;
  border-radius:14px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.card h3{
  font-size:15px;
  margin-bottom:10px;
}

.card strong{
  font-size:24px;
}

.menu{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:30px;
}

.boton{
  border:none;
  border-radius:14px;
  padding:25px 15px;
  color:white;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
  min-height:120px;
}

.azul{background:#1976d2;}
.verde{background:#18a566;}
.naranja{background:#f7941d;}
.violeta{background:#7048d7;}

.seccion{
  background:white;
  padding:25px;
  border-radius:14px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.seccion h2{
  margin-bottom:20px;
}

.upload{
  border:2px dashed #9db5ca;
  border-radius:12px;
  padding:35px;
  text-align:center;
  margin-bottom:25px;
}

.upload input{
  margin-top:15px;
}

.formulario{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

.campo{
  display:flex;
  flex-direction:column;
}

label{
  font-size:13px;
  font-weight:bold;
  margin-bottom:6px;
}

input, select{
  padding:11px;
  border:1px solid #ccd6df;
  border-radius:7px;
  font-size:15px;
}

.guardar{
  margin-top:20px;
  background:#1976d2;
  color:white;
  border:none;
  padding:14px 25px;
  border-radius:8px;
  font-size:16px;
  cursor:pointer;
}

@media(max-width:800px){
  .resumen,
  .menu,
  .formulario{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>
  <h1>📄 Contabilidad - Compras</h1>
  <p>Control de facturas, impuestos, pagos y cheques</p>
</header>

<div class="container">

  <div class="resumen">

    <div class="card">
      <h3>Total de compras</h3>
      <strong>$ 0</strong>
    </div>

    <div class="card">
      <h3>IVA 21%</h3>
      <strong>$ 0</strong>
    </div>

    <div class="card">
      <h3>IVA 10,5%</h3>
      <strong>$ 0</strong>
    </div>

    <div class="card">
      <h3>Impuestos internos</h3>
      <strong>$ 0</strong>
    </div>

  </div>

  <div class="menu">

    <button class="boton azul">
      📷 Nueva compra
    </button>

    <button class="boton verde">
      📋 Compras cargadas
    </button>

    <button class="boton naranja">
      🏦 Cheques
    </button>

    <button class="boton violeta">
      📊 Exportar a Excel
    </button>

  </div>

  <div class="seccion">

    <h2>Nueva compra</h2>

    <div class="upload">

      <h3>📷 Sacá una foto de la factura</h3>

      <p>
        También podés seleccionar una imagen desde tu computadora o celular.
      </p>

      <input
        type="file"
        accept="image/*"
        capture="environment"
      >

    </div>

    <div class="formulario">

      <div class="campo">
        <label>Fecha</label>
        <input type="date">
      </div>

      <div class="campo">
        <label>Razón social</label>
        <input type="text">
      </div>

      <div class="campo">
        <label>CUIT</label>
        <input type="text">
      </div>

      <div class="campo">
        <label>Tipo de factura</label>
        <select>
          <option>A</option>
          <option>B</option>
          <option>C</option>
        </select>
      </div>

      <div class="campo">
        <label>Número de factura</label>
        <input type="text">
      </div>

      <div class="campo">
        <label>Importe neto</label>
        <input type="number">
      </div>

      <div class="campo">
        <label>IVA 21%</label>
        <input type="number">
      </div>

      <div class="campo">
        <label>IVA 10,5%</label>
        <input type="number">
      </div>

      <div class="campo">
        <label>Impuestos internos</label>
        <input type="number">
      </div>

      <div class="campo">
        <label>Total</label>
        <input type="number">
      </div>

      <div class="campo">

        <label>Forma de pago</label>

        <select>

          <option>Efectivo caja chica</option>

          <option>Efectivo caja grande</option>

          <option>Transferencia Banco Provincia</option>

          <option>Transferencia Comafi</option>

          <option>Cheque Banco Provincia</option>

          <option>Cheque Comafi</option>

        </select>

      </div>

    </div>

    <button class="guardar">
      Guardar compra
    </button>

  </div>

</div>

</body>
</html>
